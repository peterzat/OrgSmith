# Project metadata, build configuration, and pytest configuration.
# `pip install .` builds and installs the `orgsmith` package (pure Python)
# and the `orgsmith` console entry point. The committed fixtures under
# companies/ and the recipes under recipes/ are repository data, not part of
# the installed package.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orgsmith"
# Kept in lockstep with orgsmith.__version__ (the source of truth);
# pinned by a short-tier test. 2.1.x is the M13-M16 realism-wave release (the
# fleet the README calls v2.1); 2.1.1 re-renders four fleet emails that were
# left on the pre-banner-strip render path.
version = "2.2.0"
description = "Generator of complete synthetic organizations with ground truth"
authors = [{ name = "Peter Zatloukal" }]
license = "Apache-2.0"
requires-python = ">=3.10"
# Runtime dependencies for generation and pure-Python validation. Lower
# bounds are the tested floor; the exact tested set is pinned (without hashes)
# in requirements.lock, and that residual float is stated explicitly there.
# WeasyPrint needs system Pango/Cairo, and LibreOffice is needed only at
# generation time for legacy .doc/.xls/.ppt conversion; see the Dockerfile.
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "faker>=20",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "xlsxwriter>=3.1",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "weasyprint>=60",
    "olefile>=0.46",
    "xlrd>=2.0",
    "openpyxl>=3.1",
    "pikepdf>=8.0",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.scripts]
orgsmith = "orgsmith.cli:main"
# Optional bring-your-own-token authoring driver (out-of-airlock; see drivers/).
orgsmith-author = "drivers.forge_external:main"

[tool.setuptools.packages.find]
# `drivers` is packaged alongside `orgsmith` so `python -m drivers.forge_external`
# runs from an install and `tests/` can import it. It depends on `orgsmith`;
# `orgsmith` never depends on it (the airlock stays one-way).
include = ["orgsmith*", "drivers*"]

[tool.setuptools.package-data]
orgsmith = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "short: static and configuration checks (pre-push tier)",
    "unit: deterministic logic, schemas, renderers, airlock contract",
    "org: full validation over the committed fleet in companies/",
    "flagship: the large M12 pilot org, its own tier (excluded from the default org run)",
]
addopts = "-q"
